name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js (v22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies and Capacitor
      run: |
        npm install
        npm install @capacitor/assets --save-dev

    - name: Generate Icons and Splash
      run: |
        npx cap-assets generate --ios --android --icon resources/android/icon.png --splash resources/android/splash.png

    - name: Copy to Android Platform
      run: |
        npx cap copy android || true
        npx cap update android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

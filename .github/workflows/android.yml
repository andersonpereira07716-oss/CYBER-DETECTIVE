name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js (v22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python for App Icons
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate Minimalist Tech Icons & Setup Capacitor
      run: |
        pip install Pillow
        python3 -c "
        from PIL import Image, ImageDraw
        import os

        img = Image.new('RGBA', (512, 512), (15, 15, 15, 255))
        draw = ImageDraw.Draw(img)
        draw.polygon([(256, 40), (450, 150), (450, 360), (256, 472), (62, 360), (62, 150)], outline=(30, 144, 255), width=16)
        draw.arc((150, 150, 362, 362), start=180, end=360, fill=(30, 144, 255), width=24)
        draw.ellipse((320, 320, 370, 370), fill=(30, 144, 255))

        res_dir = 'android/app/src/main/res'
        if os.path.exists('android'):
            sizes = {'mipmap-hdpi': 72, 'mipmap-mdpi': 48, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
            for folder, size in sizes.items():
                path = os.path.join(res_dir, folder)
                os.makedirs(path, exist_ok=True)
                img.resize((size, size), Image.Resampling.LANCZOS).save(os.path.join(path, 'ic_launcher.png'))
                img.resize((size, size), Image.Resampling.LANCZOS).save(os.path.join(path, 'ic_launcher_round.png'))
        "
        npm install
        npx cap copy android || true
        npx cap update android

    - name: Force Java 17 Compatibility
      run: |
        echo "org.gradle.java.home=${JAVA_HOME}" >> android/gradle.properties
        echo "android.compileSdk=34" >> android/gradle.properties
        echo "android.minSdk=22" >> android/gradle.properties
        echo "android.targetSdk=34" >> android/gradle.properties

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

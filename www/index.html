<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-DETECTIVE v4.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #05070c; color: #00ffcc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }

        /* Splash Screen */
        #splash-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0b0f19 0%, #030712 100%);
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 24px; z-index: 100; transition: opacity 0.6s ease;
        }
        .splash-header { text-align: center; margin-top: 15px; }
        .splash-header h1 { font-size: 1.4rem; letter-spacing: 3px; color: #fff; text-shadow: 0 0 15px rgba(0,255,204,0.5); }
        .splash-header p { font-size: 0.7rem; color: #dc2626; letter-spacing: 5px; margin-top: 6px; text-transform: uppercase; }

        .splash-center {
            text-align: center; color: #94a3b8; font-size: 0.8rem; border: 1px dashed #1e293b;
            padding: 20px; border-radius: 8px; background: rgba(5,7,12,0.8); width: 100%; max-width: 300px;
            box-shadow: inset 0 0 15px rgba(0,255,204,0.05);
        }
        .splash-footer { width: 100%; max-width: 320px; margin-bottom: 20px; }
        .progress-box { background: #0b0f19; border: 1px solid #1a365d; padding: 12px; border-radius: 8px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.7rem; color: #00ffcc; margin-bottom: 8px; }
        .progress-bar-bg { background: #020617; height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid #1e293b; }
        .progress-bar-fill { background: #00ffcc; height: 100%; width: 0%; transition: width 0.2s; box-shadow: 0 0 10px #00ffcc; }

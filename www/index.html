<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOWS OF EVIDENCE - CYBER-DETECTIVE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #000;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Ecrã de Apresentação / Splash Screen */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #111827 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 50;
            transition: opacity 0.5s ease;
        }
        .splash-header {
            text-align: center;
            margin-top: 10px;
        }
        .splash-header h1 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #f3f4f6;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }
        .splash-header p {
            font-size: 0.65rem;
            color: #dc2626;
            letter-spacing: 4px;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .splash-center {
            text-align: center;
            color: #94a3b8;
            font-size: 0.75rem;
            border: 1px dashed #1f2937;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0,0,0,0.4);
            width: 100%;
            max-width: 280px;
        }
        .splash-footer {
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
        }
        .progress-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 6px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #10b981;
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            background: #020617;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }
        .progress-bar-fill {
            background: #10b981;
            height: 100%;
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 8px #10b981;
        }
        .btn-start {
            display: none;
            width: 100%;
            background: #111827;
            color: #f3f4f6;
            border: 1px solid #dc2626;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(220,38,38,0.4);
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(220,38,38,0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(220,38,38,0.7); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(220,38,38,0.4); }
        }

        /* Jogo Principal (inicialmente oculto até sair do Splash) */
        #game-content {
            display: none;
            flex-direction: column;
            height: 100vh;
            padding: 12px;
        }
        header {
            border-bottom: 2px solid currentColor;
            padding-bottom: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1rem; letter-spacing: 2px; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 8px;
            color: #94a3b8;
            background: #0f172a;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }
        #terminal-box {
            flex: 1;
            background: #05070c;
            border: 1px solid #1a365d;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .log-entry { line-height: 1.4; }
        .system-msg { color: #3b82f6; }
        .success-msg { color: #10b981; }
        .prompt-msg { color: inherit; }
        .actions-panel {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button.action-btn {
            background: #111827;
            color: inherit;
            border: 1px solid currentColor;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-header">
            <h1>SHADOWS OF EVIDENCE</h1>
            <p>criminal investigation RPG</p>
        </div>
        
        <div class="splash-center">
            <p>> A carregar banco de dados forense...</p>
            <p style="margin-top: 6px; color: #64748b; font-size: 0.65rem;">Sistemas encriptados ativos.</p>
        </div>

        <div class="splash-footer">
            <div id="loading-container" class="progress-box">
                <div class="progress-info">
                    <span>SINCRONIZANDO CASOS</span>
                    <span id="load-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>
            <button id="btn-tap" class="btn-start" onclick="startGame()">TAP TO CONTINUE</button>
        </div>
    </div>

    <div id="game-content">
        <header>
            <h1>CYBER-DETECTIVE</h1>
            <div style="font-size: 0.65rem; background: rgba(0,255,204,0.1); border: 1px solid currentColor; padding: 3px 6px; border-radius: 4px;">ACTIVE</div>
        </header>

        <div class="stats-bar">
            <div>CASO: <span id="case-name">O Arquiteto</span></div>
            <div>PISTAS: <span id="clues-count">0</span>/3</div>
        </div>

        <div id="terminal-box">
            <div class="log-entry system-msg">[SYSTEM] Sessão iniciada com sucesso.</div>
            <div class="log-entry prompt-msg">> Missão: Analisar dados do servidor alvo.</div>
        </div>

        <div class="actions-panel">
            <button class="action-btn" onclick="investigate()">Analisar Logs</button>
            <button class="action-btn" onclick="hackSystem()">Invadir Rede</button>
        </div>
    </div>

    <script>
        // Simulação da barra de carregamento ao abrir
        let progress = 0;
        const fill = document.getElementById('progress-fill');
        const percent = document.getElementById('load-percent');
        const loadingContainer = document.getElementById('loading-container');
        const btnTap = document.getElementById('btn-tap');

        const loadInterval = setInterval(() => {
            progress += Math.floor(Math.random() * 20) + 10;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);
                loadingContainer.style.display = 'none';
                btnTap.style.display = 'block';
            }
            fill.style.width = progress + '%';
            percent.textContent = progress + '%';
        }, 150);

        function startGame() {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('game-content').style.display = 'flex';
            }, 500);
        }

        function investigate() {
            const term = document.getElementById('terminal-box');
            const div = document.createElement('div');
            div.className = 'log-entry success-msg';
            div.textContent = '[PISTA] Hash de acesso recuperado com sucesso.';
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
            document.getElementById('clues-count').textContent = '1';
        }

        function hackSystem() {
            const term = document.getElementById('terminal-box');
            const div = document.createElement('div');
            div.className = 'log-entry system-msg';
            div.textContent = '[FIREWALL] Acesso root concedido!';
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
            document.getElementById('clues-count').textContent = '2';
        }
    </script>
</body>
</html>

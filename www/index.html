<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-DETECTIVE v4.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #05070c; color: #00ffcc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        
        /* Splash Screen */
        #splash-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0b0f19 0%, #030712 100%);
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 24px; z-index: 100; transition: opacity 0.6s ease;
        }
        .splash-header { text-align: center; margin-top: 15px; }
        .splash-header h1 { font-size: 1.4rem; letter-spacing: 3px; color: #fff; text-shadow: 0 0 15px rgba(0,255,204,0.5); }
        .splash-header p { font-size: 0.7rem; color: #dc2626; letter-spacing: 5px; margin-top: 6px; text-transform: uppercase; }
        
        .splash-center {
            text-align: center; color: #94a3b8; font-size: 0.8rem; border: 1px dashed #1e293b;
            padding: 20px; border-radius: 8px; background: rgba(5,7,12,0.8); width: 100%; max-width: 300px;
            box-shadow: inset 0 0 15px rgba(0,255,204,0.05);
        }
        .splash-footer { width: 100%; max-width: 320px; margin-bottom: 20px; }
        .progress-box { background: #0b0f19; border: 1px solid #1a365d; padding: 12px; border-radius: 8px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.7rem; color: #00ffcc; margin-bottom: 8px; }
        .progress-bar-bg { background: #020617; height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid #1e293b; }
        .progress-bar-fill { background: #00ffcc; height: 100%; width: 0%; transition: width 0.2s; box-shadow: 0 0 10px #00ffcc; }
        
        .btn-start {
            display: none; width: 100%; background: #0b0f19; color: #00ffcc; border: 2px solid #00ffcc;
            padding: 14px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; letter-spacing: 3px;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(0,255,204,0.3);
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0,255,204,0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(0,255,204,0.6); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        }

        /* Jogo Principal */
        #game-content { display: none; flex-direction: column; height: 100vh; padding: 12px; }
        header { border-bottom: 2px solid #00ffcc; padding-bottom: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; letter-spacing: 2px; text-shadow: 0 0 8px rgba(0,255,204,0.4); }
        .top-nav { display: flex; gap: 6px; }
        .nav-btn { background: transparent; color: #00ffcc; border: 1px solid #00ffcc; padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; cursor: pointer; }
        
        .stats-bar { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 8px; color: #94a3b8; background: #0b0f19; padding: 6px 10px; border-radius: 6px; border: 1px solid #1a365d; }
        
        #terminal-box {
            flex: 1; background: #030508; border: 1px solid #1a365d; border-radius: 6px; padding: 12px;
            overflow-y: auto; font-size: 0.8rem; display: flex; flex-direction: column; gap: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .log-entry { line-height: 1.5; }
        .system-msg { color: #3b82f6; }
        .success-msg { color: #10b981; }
        .prompt-msg { color: #00ffcc; }
        
        .actions-panel { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button.action-btn { background: #0b0f19; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; box-shadow: 0 0 10px rgba(0,255,204,0.15); }
        button.action-btn:active { background: #1a365d; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-header">
            <h1>SHADOWS OF EVIDENCE</h1>
            <p>criminal investigation RPG</p>
        </div>
        
        <div class="splash-center">
            <p>> A carregar base forense...</p>
            <p style="margin-top: 6px; color: #64748b; font-size: 0.7rem;">Sistemas cibernéticos blindados.</p>
        </div>

        <div class="splash-footer">
            <div id="loading-container" class="progress-box">
                <div class="progress-info">
                    <span>SINCRONIZANDO CASOS</span>
                    <span id="load-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>
            <button id="btn-tap" class="btn-start" onclick="startGame()">TAP TO CONTINUE</button>
        </div>
    </div>

    <div id="game-content">
        <header>
            
<div class="top-nav">
    <button class="nav-btn" onclick="openProfile()">PERFIL</button>
    <button class="nav-btn" onclick="toggleColor()">COR</button>
    <button class="nav-btn" style="background: rgba(0,255,204,0.2);" onclick="openFreeMode()">FREE</button>
</div>

        </header>

        <div class="stats-bar">
            <div>CASO: <span id="case-name">O Arquiteto</span></div>
            <div>PISTAS: <span id="clues-count">0</span>/3</div>
            <div>NÍVEL: 1</div>
        </div>

        <div id="terminal-box">
            <div class="log-entry system-msg">[SYSTEM] Terminal v4.0 Ativado com Som/Glitch FX.</div>
            <div class="log-entry prompt-msg">> Missão 1: Iniciar investigação forense nos servidores corporativos.</div>
        </div>

        <div class="actions-panel">
            <button class="action-btn" onclick="investigate()">Analisar Logs</button>
            <button class="action-btn" onclick="hackSystem()">Invadir Firewall</button>
            <button class="action-btn" onclick="decodeClue()" style="opacity: 0.6;">Descodificar Pista</button>
            <button class="action-btn" onclick="nextCase()" style="opacity: 0.6;">Próximo Caso</button>
        </div>
    </div>

    <script>
        // Lógica de Carregamento da Splash Screen
        let progress = 0;
        const fill = document.getElementById('progress-fill');
        const percent = document.getElementById('load-percent');
        const loadingContainer = document.getElementById('loading-container');
        const btnTap = document.getElementById('btn-tap');

        const loadInterval = setInterval(() => {
            progress += Math.floor(Math.random() * 25) + 10;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);
                loadingContainer.style.display = 'none';
                btnTap.style.display = 'block';
            }
            fill.style.width = progress + '%';
            percent.textContent = progress + '%';
        }, 180);

        function startGame() {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('game-content').style.display = 'flex';
            }, 600);
        }

        // Funções interativas do Terminal
        function investigate() {
            const term = document.getElementById('terminal-box');
            term.innerHTML += '<div class="log-entry success-msg">> [PISTA] Registo de acesso suspeito detetado no setor 7.</div>';
            term.scrollTop = term.scrollHeight;
            document.getElementById('clues-count').textContent = '1';
        }

        function hackSystem() {
            const term = document.getElementById('terminal-box');
            term.innerHTML += '<div class="log-entry system-msg">> [FIREWALL] Acesso root concedido com sucesso ao terminal remoto.</div>';
            term.scrollTop = term.scrollHeight;
            document.getElementById('clues-count').textContent = '2';
        }

        function openProfile() {
            alert('Perfil de Investigador: Nível 1 - Acesso Liberado.');
        }

        function toggleColor() {
            alert('Modo de alta visibilidade ativado.');
        }
    </script>
</body>
</html>

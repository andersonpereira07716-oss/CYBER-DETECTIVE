<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-DETECTIVE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 15px;
        }
        header {
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0,255,204,0.6);
        }
        .status-badge {
            font-size: 0.75rem;
            background: rgba(0,255,204,0.1);
            border: 1px solid #00ffcc;
            padding: 3px 8px;
            border-radius: 4px;
        }
        #terminal-box {
            flex: 1;
            background: #05070c;
            border: 1px solid #1a365d;
            border-radius: 6px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .log-entry {
            line-height: 1.4;
        }
        .system-msg {
            color: #3b82f6;
        }
        .warning-msg {
            color: #f59e0b;
        }
        .success-msg {
            color: #10b981;
        }
        .prompt-msg {
            color: #00ffcc;
        }
        .actions-panel {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            background: #111827;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        button:active {
            background: #00ffcc;
            color: #0b0f19;
            box-shadow: 0 0 12px #00ffcc;
        }
    </style>
</head>
<body>

    <header>
        <h1>CYBER-DETECTIVE v1.0</h1>
        <div class="status-badge" id="net-status">SECURE_LINK</div>
    </header>

    <div id="terminal-box">
        <div class="log-entry system-msg">[SYSTEM] Inicializando kernel de investigação...</div>
        <div class="log-entry system-msg">[SYSTEM] Conexão estabelecida com o mainframe central.</div>
        <div class="log-entry prompt-msg">> Caso Ativo: O Desaparecimento do Arquiteto. Toque em "Analisar Logs" para iniciar.</div>
    </div>

    <div class="actions-panel">
        <button onclick="investigateLogs()">Analisar Logs</button>
        <button onclick="hackTerminal()">Invadir Nó</button>
    </div>

    <script>
        const terminal = document.getElementById('terminal-box');

        function addLog(text, className = 'prompt-msg') {
            const div = document.createElement('div');
            div.className = `log-entry ${className}`;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function investigateLogs() {
            addLog("> A aceder aos registos de acesso do terminal...", "system-msg");
            setTimeout(() => {
                addLog("[ALERTA] Encontrado IP desconhecido a aceder à firewall às 03:42 AM.", "warning-msg");
                addLog("[PISTA] O alvo deixou um rasto criptografado na porta 8080.", "success-msg");
            }, 600);
        }

        function hackTerminal() {
            addLog("> A iniciar protocolo de força bruta...", "warning-msg");
            setTimeout(() => {
                addLog("[SUCESSO] Firewall bypassada! Acesso root concedido.", "success-msg");
                document.getElementById('net-status').style.borderColor = '#10b981';
                document.getElementById('net-status').style.color = '#10b981';
                document.getElementById('net-status').textContent = 'ROOT_ACCESS';
            }, 800);
        }
    </script>
</body>
</html>
